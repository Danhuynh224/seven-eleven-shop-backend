services:
  postgres:
    image: postgres:16-alpine
    container_name: seven_eleven_postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-shop}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shop}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shop_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seven_eleven_backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL:           jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shop}
      DB_USERNAME:      ${POSTGRES_USER:-postgres}
      DB_PASSWORD:      ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET:       ${JWT_SECRET:-dev-secret-key-change-in-prod-must-be-at-least-32-chars!!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shop_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  shop_network:
    driver: bridge
