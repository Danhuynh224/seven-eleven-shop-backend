spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/shop}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    vn.sevenleven.shop: INFO
    org.springframework.security: WARN
