spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shop
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: dev-secret-key-please-change-in-production-must-be-at-least-32-chars
    expiration-ms: 86400000

spring:
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    vn.sevenleven.shop: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
